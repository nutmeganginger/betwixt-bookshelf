<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback | Betwixt Book List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- PROXIMA NOVA: paste the same Adobe Fonts <link> you added to index.html here. -->
<style>
@font-face{font-family:"SlimSansSerif";src:url("fonts/SlimSansSerif-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--ink:#16141a;--mute:#6b6874;--accent:#F30650;--glow:0 0 2px 2px rgba(243,6,80,.5);--r:6px;
--display:"SlimSansSerif","Figtree",system-ui,sans-serif;--sans:"proxima-nova","Proxima Nova","Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 var(--sans)}
main{max-width:680px;margin:0 auto;padding:72px 24px 96px}
.site{display:inline-block;margin-bottom:24px;color:var(--mute);font-weight:600;text-decoration:none}
.site:hover{text-decoration:underline;text-underline-offset:4px}
h1{font:700 clamp(1.75rem,8.5vw,3.5rem)/1.05 var(--display);letter-spacing:-.01em;margin:0 0 20px;white-space:nowrap}
h2{font:700 1.6rem/1.15 var(--display);letter-spacing:-.01em;margin:40px 0 8px}
p{margin:0 0 16px;font-size:1.05rem;max-width:60ch}
.menu{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 40px}
.menu a{color:var(--ink);font-weight:600;text-decoration:none;padding:4px 0}
.menu a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--accent)}
.menu a[aria-current]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.btn{display:inline-block;padding:11px 20px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--accent);border-color:var(--accent);color:#000;font-weight:600;text-decoration:none}
.btn:hover{box-shadow:var(--glow)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
form{max-width:520px}
fieldset{border:0;padding:0;margin:0 0 24px}
legend{font-weight:600;margin-bottom:10px;padding:0}
.req{font-weight:400;color:var(--mute)}
fieldset label{display:block;padding:6px 0}
input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px}
.f{display:block;font-weight:600;margin:0 0 8px}
textarea,input[type=text]{display:block;width:100%;margin:0 0 24px;padding:12px 16px;border:1.5px solid var(--ink);border-radius:var(--r);font:inherit;background:#fff;color:var(--ink)}
textarea:hover,input[type=text]:hover,textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
button.btn{font:inherit;font-weight:600;cursor:pointer}
button.btn:disabled{opacity:.6;cursor:default}
#msg{min-height:1.6em;color:#b00020;margin:0 0 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<a class="site" href="index.html">Betwixt Book List</a>
<h1>Feedback</h1>
<nav class="menu" aria-label="Site">
<a href="index.html">Books</a>
<a href="about.html">About</a>
<a href="https://lnkfi.re/btx" target="_blank" rel="noopener">The podcast<span style="position:absolute;left:-9999px"> (opens in a new tab)</span></a>
<a href="feedback.html" aria-current="page">Feedback</a>
</nav>
<h2>Help me improve the site!</h2>
<form id="fb" novalidate>
<fieldset>
<legend>Is this website helpful? <span class="req">(required)</span></legend>
<label><input type="radio" name="helpful" value="5 - Extremely helpful"> 5 – Extremely helpful</label>
<label><input type="radio" name="helpful" value="4 - Moderately helpful"> 4 – Moderately helpful</label>
<label><input type="radio" name="helpful" value="3 - Neither helpful nor unhelpful"> 3 – Neither helpful nor unhelpful</label>
<label><input type="radio" name="helpful" value="2 - Moderately unhelpful"> 2 – Moderately unhelpful</label>
<label><input type="radio" name="helpful" value="1 - Extremely unhelpful"> 1 – Extremely unhelpful</label>
</fieldset>
<label class="f" for="sug">Do you have any suggestions to improve this site?</label>
<textarea id="sug" name="suggestions" rows="5"></textarea>
<label class="f" for="nm">Name</label>
<input id="nm" name="name" type="text" autocomplete="name">
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<p id="msg" role="status" aria-live="polite"></p>
<button class="btn" type="submit">Send feedback</button>
</form>
<p id="thanks" role="status" hidden>Thank you for your response. ✨</p>
</main>
<script>
/* Paste your Formspree form link between the quotes, e.g. https://formspree.io/f/abcdwxyz */
const FORM_ENDPOINT="";
const form=document.getElementById("fb"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
  e.preventDefault();msg.textContent="";
  if(!form.helpful.value){msg.textContent="Please choose how helpful the site is.";return}
  if(!FORM_ENDPOINT){msg.textContent="The feedback form isn't connected yet.";return}
  const btn=form.querySelector("button");btn.disabled=true;btn.textContent="Sending…";
  try{
    const r=await fetch(FORM_ENDPOINT,{method:"POST",body:new FormData(form),headers:{Accept:"application/json"}});
    if(!r.ok)throw 0;
    form.hidden=true;document.getElementById("thanks").hidden=false;
  }catch(err){msg.textContent="Something went wrong. Please try again.";btn.disabled=false;btn.textContent="Send feedback"}
});
</script>
</body>
</html>
