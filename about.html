<style>
@font-face{font-family:"SlimSansSerif";src:url("fonts/SlimSansSerif-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--ink:#16141a;--mute:#6b6874;--accent:#F30650;--glow:0 0 2px 2px rgba(243,6,80,.5);--r:6px;

html{scrollbar-gutter:stable}

.menu a{color:var(--ink);font-weight:600;text-decoration:none;padding:4px 0}
.menu a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--accent)}
.menu a[aria-current]{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}

.btn:hover{box-shadow:var(--glow)}
